version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      mcp-core:
        patterns:
          - "mcp"
      astro-stack:
        patterns:
          - "pysweph"
          - "numpy"
          - "matplotlib"
      utilities:
        patterns:
          - "python-dateutil"
          - "sqlalchemy"
          - "timezonefinder"
    ignore:
      # The MCP Python SDK 2.x removed the Server.list_tools()/call_tool() decorators this server
      # is built on. An unbounded requirement broke every fresh install (see the 0.12.1 changelog).
      # Migrating to the 2.x API is on the roadmap; until then stay on 1.x.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # timezonefinder 8.x pulls in a compiled dependency (h3) that breaks installs without CMake
      # (see the 0.11.2 changelog).
      - dependency-name: "timezonefinder"
        versions: [">=8.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
